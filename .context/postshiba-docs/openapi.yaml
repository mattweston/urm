        bounce: { type: integer }
        spamreport: { type: integer }
        unsubscribe: { type: integer }
    CapsuleAnalytics:
      type: object
      additionalProperties: false
      properties:
        dimension: { type: string }
        window:
          type: object
          additionalProperties: false
          properties:
            since: { type: string, format: date-time }
            until: { type: string, format: date-time }
        totals:
          type: object
          additionalProperties: { type: integer }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CapsuleAnalyticsRow"
        compare:
          type: [object, "null"]
          additionalProperties: false
          properties:
            dimension: { type: string }
            window:
