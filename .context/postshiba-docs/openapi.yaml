      - $ref: "#/components/parameters/id"
    get:
      operationId: getInboundMessage
      summary: Get an inbound message
      description: Includes raw MIME and attachment content_base64. Both are null after a webhook inbox delivers or gives up.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
