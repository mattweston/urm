          email: example45@email.com

    WebhooksOutgoingEndpointAttributes:
      type: object
      title: Webhooks
      description: Webhooks
      required:
      - id
      - team_id
      - url
      - name
      properties:
        id:
          type: integer
          description: Endpoint ID
        team_id:
          type: integer
          description: Team ID
        url:
          type: string
          description: URL
        name:
          type: string
          description: Name
        event_type_ids:
          type:
          - array
          - 'null'
          description: Event Types
        deactivation_limit_reached_at:
          type:
          - string
          - 'null'
          description: Deactivation Limit Reached At
        deactivated_at:
          type:
          - string
          - 'null'
          description: Deactivated At
        consecutive_failed_deliveries:
          type:
          - integer
          - 'null'
          description: Consecutive Failed Deliveries
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Added
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated
      example:
        id: 42
        team_id: 42
        url: https://example.com/some-endpoint-url
        name: Example Endpoint
        event_type_ids: []
        deactivation_limit_reached_at:
        deactivated_at:
        consecutive_failed_deliveries: 0
        created_at: '2023-01-01T00:00:00.000Z'
        updated_at: '2023-01-02T00:00:00.000Z'
    WebhooksOutgoingEndpointParameters:
      type: object
      title: Webhooks
      description: Webhooks
      required:
      - url
      - name
      properties:
        url:
          type: string
          description: URL
        name:
          type: string
          description: Name
        event_type_ids:
          type:
          - array
          - 'null'
          description: Event Types
        deactivated_at:
          type:
          - string
          - 'null'
          description: Deactivated At
      example:
        webhooks_outgoing_endpoint:
          url: https://example.com/some-endpoint-url
          name: Example Endpoint
          event_type_ids: []
          deactivated_at:
    WebhooksOutgoingEndpointParametersUpdate:
      type: object
      title: Webhooks
      description: Webhooks
      required:
      - url
      - name
      properties:
        url:
          type: string
