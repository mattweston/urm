    parameters:
      - $ref: "#/components/parameters/id"
    get:
      operationId: getShieldSite
      summary: Get a ShieldShiba site
      description: Includes secret_key.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
