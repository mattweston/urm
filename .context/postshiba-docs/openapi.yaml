      operationId: updateShieldSite
      summary: Update a ShieldShiba site
      description: Omits secret_key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shield_site:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    allowed_hostnames:
                      oneOf:
                        - { type: string }
                        - { type: array, items: { type: string } }
                    block_hosting: { type: boolean }
                    block_free_email: { type: boolean }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
