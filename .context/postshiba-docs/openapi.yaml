        invitation_id:
          type:
          - string
          - 'null'
          description: Invitation ID
        user_first_name:
          type:
          - string
          - 'null'
          description: First Name
        user_last_name:
          type:
          - string
          - 'null'
          description: Last Name
        user_profile_photo_id:
          type:
          - string
          - 'null'
          description: Profile Photo
        user_email:
          type:
          - string
          - 'null'
          description: User Email
        added_by_id:
          type:
          - string
          - 'null'
          description: Added by User ID
        platform_agent_of_id:
          type:
          - string
          - 'null'
          description: Platform Agent of ID
        role_ids:
          type:
          - array
          - 'null'
