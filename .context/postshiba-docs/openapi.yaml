openapi: 3.1.0
info:
  title: PostShiba API
  description: |
    Email infrastructure for platforms that send on behalf of their customers. Customer sending controls, delivery diagnostics, and monthly capacity pricing from the team behind Bento.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  version: "V1"
servers:
  - url: https://app.postshiba.com/api/v1
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    TeamAttributes:
      type: object
      title: Teams
      description: Teams
      required:
      - id
      - name
      properties:
        id:
          type: string
          description: Team ID
        name:
          type: string
          description: Team
        time_zone:
          type:
          - string
          - 'null'
          description: Primary Time Zone
        locale:
          type:
          - string
          - 'null'
          description: Language
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Signed Up At
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated At
      example:
        id: WjmmMj
        name: EXAMPLE Generic Team 153
        time_zone: International Date Line West
        locale: en
        created_at: '2023-01-01T00:00:00.000Z'
        updated_at: '2023-01-02T00:00:00.000Z'
    TeamParametersUpdate:
      type: object
      title: Teams
      description: Teams
      required:
      - name
      properties:
        name:
          type: string
          description: Team
        time_zone:
          type:
          - string
          - 'null'
          description: Primary Time Zone
        locale:
          type:
          - string
          - 'null'
          description: Language
      example:
        team:
          name: EXAMPLE Generic Team 153
          time_zone: International Date Line West
          locale: en

    UserAttributes:
      type: object
      title: Users
      description: Users
      required:
      - id
      - email
      properties:
        id:
          type: string
          description: Team ID
        email:
          type: string
          description: Email address
        first_name:
          type:
          - string
          - 'null'
          description: First Name
        last_name:
          type:
          - string
          - 'null'
          description: Last Name
        time_zone:
          type:
          - string
          - 'null'
          description: Your Time Zone
        locale:
          type:
          - string
          - 'null'
          description: Language
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Signed Up At
        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated At
        profile_photo:
          type: object
          description: Profile Photo
      example:
        id: WJmmMJ
        email: generic-user-153@example.com
        first_name: Example First Name
        last_name: Example Last Name
        time_zone: International Date Line West
        locale:
        created_at: '2023-01-01T00:00:00.000Z'
        updated_at: '2023-01-02T00:00:00.000Z'
        profile_photo:
    UserParametersUpdate:
      type: object
      title: Users
      description: Users
      required:
      - email
      properties:
        email:
          type: string
          description: Email address
        first_name:
          type:
          - string
          - 'null'
          description: First Name
        last_name:
          type:
          - string
          - 'null'
          description: Last Name
        time_zone:
          type:
          - string
          - 'null'
          description: Your Time Zone
        locale:
          type:
          - string
          - 'null'
          description: Language
      example:
        user:
          email: generic-user-153@example.com
          first_name: Example First Name
          last_name: Example Last Name
          time_zone: International Date Line West
          locale:

    MembershipAttributes:
