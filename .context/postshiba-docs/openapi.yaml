              additionalProperties: false
              properties:
                since: { type: string, format: date-time }
                until: { type: string, format: date-time }
            totals:
              type: object
              additionalProperties: { type: integer }
            rows:
              type: array
              items:
                $ref: "#/components/schemas/CapsuleAnalyticsRow"
    CapsuleStatus:
      type: object
      additionalProperties: false
