  /teams/{obfuscated_team_id}/clusters:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    get:
      operationId: listClusters
      summary: List clusters
      description: Live clusters only. Excludes deprovisioned. Computed status and SMTP.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Cluster list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapsuleCluster"
    post:
      operationId: createCluster
      summary: Create a shared-IP cluster
      description: A pending team can create one. A second cluster returns kyc_required until the team is approved. Issues a default SMTP user that is not in the response. Returns payment_required when Stripe billing is on and the team has no card. Always sets ip_assignment to shared. During beta, plan must be nano, micro, small, medium, or large.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cluster:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    region: { type: string }
                    size: { type: string }
                    plan: { type: string }
                    classification: { type: string, enum: [transactional, bulk] }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "201":
          description: Created cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleCluster"
        "403":
          description: kyc_required (second cluster while pending) or payment_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: Validation failed, including no shared IP stocked for the chosen classification
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errors:
                    type: array
                    items: { type: string }
  /clusters/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      operationId: getCluster
      summary: Get a cluster
      description: Computed status, SMTP endpoint, assigned IP, sending_ready, and refused_sends from the last 7 days.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleCluster"
    patch:
      operationId: updateCluster
      summary: Update a cluster
      description: Same fields as account edit. During beta, plan must be nano, micro, small, medium, or large. Changing plan bumps the hourly throttle and syncs Stripe capacity when configured.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                cluster:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    region: { type: string }
                    size: { type: string }
                    plan: { type: string }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Updated cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleCluster"
        "422":
          description: "Validation failed, or {error: archived} if the cluster is deprovisioned"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errors:
                    type: array
                    items: { type: string }
                  error: { type: string }
    delete:
      operationId: teardownCluster
      summary: Teardown a cluster
      description: Calls Cluster#teardown!. The row stays. desired_status becomes deprovisioned. Live SMTP credentials are disabled. Domains are untouched.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Torn-down cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleCluster"
  /clusters/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: suspendCluster
      summary: Suspend a cluster
      description: "Calls Cluster#suspend!. Returns 422 {error: archived} if the cluster is deprovisioned."
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Suspended cluster
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleCluster"
        "422":
          description: "{error: archived} if the cluster is deprovisioned"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /emails:
    post:
      operationId: createEmail
      summary: Compose and queue. Optional X-Capsule-Cluster-Id pins a cluster
      description: "Same body and gates as POST /sends. The token picks the team. POST /emails still does not need a cluster id. Optional request header X-Capsule-Cluster-Id pins a sending cluster the token's team owns. With tenant and no header, it uses a sending-ready cluster that has a live credential for that tenant. Otherwise the first sending-ready cluster. Returns 403 {error: cluster_not_ready, field: cluster} when none matches. A cluster the token's team does not own is 404."
      parameters:
        - name: X-Capsule-Cluster-Id
          in: header
          required: false
          schema: { type: string, example: NmQpXr }
          description: Optional request header. Public cluster id the token's team owns. Overrides tenant and first-ready pick.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapsuleSendRequest"
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "201":
          description: Queued send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSend"
        "403":
          description: "{error, field, message}. cluster_not_ready, domain_unverified, domain_suspended, credential_missing, suppressed, firewall, or kyc_required."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "413":
          description: "{error: payload_too_large, field, message}. A request body over 36 MB, attachments over 18 MB in total, or a composed message over 25 MB."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: "{error: invalid | too_many_recipients, field, message}. too_many_recipients when to, cc, and bcc hold more than 50 addresses."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "502":
          description: "{error: inject_failed | inject_timeout_unknown, field: base, message, retryable: false}. inject_timeout_unknown means the message may have been queued."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "503":
          description: "{error: inject_unavailable, field: base, message, retryable: true}. The cluster could not be reached and nothing was sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /teams/{obfuscated_team_id}/clusters/{obfuscated_cluster_id}/sends:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
      - $ref: "#/components/parameters/obfuscated_cluster_id"
    post:
      operationId: createSend
      summary: Compose and queue a message on one cluster
      description: Validates a verified From domain and a sending_ready cluster, composes RFC822, and POSTs inject. A flat body is preferred. Nested send is still accepted. Optional Idempotency-Key replays the first 201 for 24 hours and is reserved before the send, so a concurrent or timed-out request with the same key is never sent twice.
      parameters:
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string, minLength: 1, maxLength: 256 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapsuleSendRequest"
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Sandbox compose. queued is false. Inject was not called.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSend"
        "201":
          description: Queued send
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSend"
        "400":
          description: Idempotency-Key is present and not 1 to 256 characters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "403":
          description: "{error, field, message}. cluster_not_ready, domain_unverified, domain_suspended, credential_missing, suppressed, firewall, or kyc_required."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "409":
          description: "idempotency_conflict when the key was used with a different body, cluster, or sandbox flag. idempotency_in_progress while the first request runs. idempotency_outcome_unknown when that request timed out and may have been queued."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "413":
          description: "{error: payload_too_large, field, message}. A request body over 36 MB, attachments over 18 MB in total, or a composed message over 25 MB."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: "{error: invalid | too_many_recipients, field, message}. too_many_recipients when to, cc, and bcc hold more than 50 addresses."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "502":
          description: "{error: inject_failed | inject_timeout_unknown, field: base, message, retryable: false}. inject_timeout_unknown means the message may have been queued."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "503":
          description: "{error: inject_unavailable | idempotency_unavailable, field, message, retryable: true}. The cluster could not be reached, or an Idempotency-Key could not be stored. Nothing was sent."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /clusters/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/id"
