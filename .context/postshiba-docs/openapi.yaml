    parameters:
      - name: inbox_id
        in: path
        required: true
        schema: { type: string, example: PqRzMn }
      - $ref: "#/components/parameters/id"
      - name: index
        in: path
        required: true
        schema: { type: integer, minimum: 1 }
        description: 1-based position in the message attachments array.
    get:
      operationId: downloadInboundAttachment
      summary: Download an inbound attachment
      description: Returns the decoded file. Index is 1-based and matches the attachments array on show. Returns 410 after a webhook inbox delivers or gives up.
