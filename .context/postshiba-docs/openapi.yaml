            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleEmailTemplate"
  /teams/{obfuscated_team_id}/suppressions:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    get:
      operationId: listSuppressions
      summary: List suppressions
      description: Id-ascending pages. Default 100, max 1000.
      parameters:
        - $ref: "#/components/parameters/after"
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 100, maximum: 1000 }
          description: Page size. Default 100. Max 1000.
        - name: email
          in: query
          required: false
          schema: { type: string }
          description: Case-insensitive exact address. Plus tags collapse to the stripped address.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Suppression list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapsuleSuppression"
    post:
      operationId: createSuppression
      summary: Add a suppression
      description: Reason is always manual. Optional tenant_id defaults to the team's default tenant.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                suppression:
                  type: object
                  additionalProperties: false
                  properties:
                    email: { type: string }
                    tenant_id: { type: string, example: WbLcFd }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "201":
          description: Created suppression
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSuppression"
  /teams/{obfuscated_team_id}/suppressions/import:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    post:
      operationId: importSuppressions
      summary: Import suppressions
      description: Add many addresses. Reason is always manual. Optional tenant_id defaults to the team's default tenant. Existing rows are skipped. Max 10,000 addresses. A CSV file is also accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                emails:
                  type: array
                  items: { type: string }
                  example: ["blocked@example.com", "old@example.com"]
                tenant_id: { type: string, example: WbLcFd }
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              properties:
                file: { type: string, format: binary }
                emails:
                  type: array
                  items: { type: string }
                tenant_id: { type: string, example: WbLcFd }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "422":
          $ref: "#/components/responses/CapsuleUnprocessable"
        "200":
          description: Import counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSuppressionImport"
  /suppressions/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    delete:
      operationId: deleteSuppression
      summary: Remove a suppression
      description: Deletes the row.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "204":
          description: Removed
