        updated_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Updated At
        user_profile_photo:
          type: object
          description: User Profile Photo
      example:
        id: WJmmMJ
        team_id: WjmmMj
        user_id: 42
        invitation_id:
