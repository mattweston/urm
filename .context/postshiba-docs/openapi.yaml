              schema:
                $ref: "#/components/schemas/CapsuleCluster"
        "403":
          description: kyc_required, payment_required, or team_suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: "{error: dedicated} or {error: not_archived}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /clusters/{id}/boost:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: boostCluster
      summary: Buy a 24-hour outbound capacity boost
      description: "Server chooses price and target from sku. Does not change cluster.plan or the monthly subscription. Returns 404 {error: feature_disabled} unless CAPACITY_BOOSTS_ENABLED=1. Returns 403 {error: payment_required} when Stripe billing is on and the team has no card."
