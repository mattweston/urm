          url: https://example.com/some-endpoint-url
          name: Example Endpoint
          event_type_ids: []
          deactivated_at:

    WebhooksOutgoingEventAttributes:
      type: object
      title: Webhooks Events
      description: Webhooks Events
      required:
      - id
      - team_id
      - subject_id
      properties:
        id:
          type: integer
          description: Event ID
        team_id:
          type: integer
          description: Team ID
        uuid:
          type:
          - string
          - 'null'
          description: UUID
        event_type_id:
          type:
          - string
          - 'null'
          description: Event Type
        subject_id:
          type: integer
          description: Subject ID
        subject_type:
          type:
          - string
          - 'null'
          description: Subject Type
        data:
          type:
          - string
          - 'null'
          description: Object Data
        created_at:
          type:
          - string
          - 'null'
          format: date-time
          description: Happened At
      example:
        id: 42
        team_id: 42
        uuid: c7232a57788121753ce8d3a9dcb625b3
        event_type_id: scaffolding/absolutely_abstract/creative_concept.created
        subject_id: 42
        subject_type: Scaffolding::AbsolutelyAbstract::CreativeConcept
        data: '{"id":42,"created_at":"2023-01-01T00:00:00.000Z","updated_at":"2023-01-02T00:00:00.000Z","value":"one"}'
        created_at: '2023-01-01T00:00:00.000Z'

    
    CapsuleCluster:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: NmQpXr }
        name: { type: string }
        region: { type: string }
        size: { type: string }
        plan: { type: string }
        emails_per_hour: { type: integer, description: "Current hourly throttle, including an active outbound boost." }
        emails_per_day: { type: integer, description: "Current 24-hour outbound cap, including an active outbound boost." }
        base_emails_per_hour: { type: integer, description: "Monthly plan hourly throttle." }
        base_emails_per_day: { type: integer, description: "Monthly plan 24-hour outbound cap." }
        boost:
          type: [object, "null"]
          additionalProperties: false
          properties:
            sku: { type: string }
            trigger: { type: string, enum: [manual, auto], description: "auto when the cluster boosted itself at its limit." }
            status: { type: string }
            target_plan: { type: string }
            target_emails_per_hour: { type: integer, description: "Boosted hourly throttle." }
            target_emails_per_day: { type: integer, description: "Boosted 24-hour outbound cap." }
            starts_at: { type: [string, "null"] }
            ends_at: { type: [string, "null"] }
        auto_boost:
          type: object
          additionalProperties: false
          properties:
            sku: { type: [string, "null"], description: "The boost the cluster switches on at its limit, or null when auto-boost is off." }
            monthly_limit: { type: integer, minimum: 1, maximum: 10 }
            used_this_month: { type: integer }
        ip_assignment: { type: string }
        desired_status: { type: string }
        status: { type: string }
        smtp_endpoint: { type: [string, "null"] }
        http_endpoint: { type: [string, "null"] }
        classification: { type: string, enum: [transactional, bulk] }
        assigned_ip:
          type: [object, "null"]
          additionalProperties: false
          properties:
            address: { type: [string, "null"] }
            status: { type: string }
        sending_ips:
          type: array
          items:
            $ref: "#/components/schemas/CapsuleSendingIp"
        sending_ready: { type: boolean }
        refused_sends:
          type: array
          description: "SMTP refusals from the last 7 days. Empty when the cluster accepted every login."
          items:
            type: object
            additionalProperties: false
            properties:
              smtp_username: { type: string }
              reason: { type: string, enum: [unavailable] }
              count: { type: integer }
              first_at: { type: string, format: date-time }
              last_at: { type: string, format: date-time }
    CapsuleSendingIp:
      type: object
      additionalProperties: false
      properties:
        address: { type: [string, "null"] }
        status: { type: string }
        kind: { type: string, enum: [shared, dedicated] }
        classification: { type: string, enum: [transactional, bulk] }
        weight: { type: integer }
        provider: { type: [string, "null"] }
    CapsuleNetworkIp:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: IpQwEr }
        address: { type: [string, "null"] }
        status: { type: string }
        kind: { type: string, enum: [shared, dedicated] }
        classification: { type: string, enum: [transactional, bulk] }
        provider: { type: [string, "null"] }
        owned: { type: boolean }
        available: { type: boolean }
        cluster_ids:
          type: array
          items: { type: string, example: NmQpXr }
        feedback_loops:
          type: array
          items: { type: string, example: Validity }
    CapsuleSendingDomain:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: HsVtYk }
        name: { type: string }
        tenant_id: { type: string, example: WbLcFd }
        tenant: { type: string }
        dkim_status: { type: string }
        return_path_status: { type: string }
        dmarc_status: { type: string }
        sending_allowed: { type: boolean }
        dkim_selector: { type: string }
        dkim_manual: { type: boolean }
        dkim_txt: { type: string }
        dkim_cname_host: { type: string }
        dkim_cname_target: { type: [string, "null"] }
        dmarc_host: { type: string }
        dmarc_record: { type: string }
        return_path_host: { type: string }
        return_path_target: { type: string }
        last_verification_error: { type: [string, "null"] }
        suspended: { type: boolean }
        operator_held: { type: boolean }
        primary: { type: boolean }
    CapsuleCanISendThisReady:
      type: object
      additionalProperties: false
      required: [status, report]
      properties:
        status: { type: string, enum: [ready] }
        report:
          type: object
          additionalProperties: false
          required: [subject, from, score, checks, spf, dkim, dmarc, spamassassin, report_url]
          properties:
            subject: { type: string }
            from: { type: string }
            score:
              type: object
              additionalProperties: false
              properties:
                pass: { type: integer }
                total: { type: integer }
            checks:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  id: { type: string }
                  kind: { type: string }
                  detail: { type: string }
            spf:
              type: object
              additionalProperties: false
              properties:
                kind:
                  type: string
                  description: pass, fail, or pending. pending means the return-path CNAME is live in DNS but CanISendThis has not seen it yet. Run the test again later.
                detail: { type: string }
            dkim:
              type: object
              additionalProperties: false
              properties:
                kind: { type: string }
                detail: { type: string }
            dmarc:
              type: object
              additionalProperties: false
              properties:
                kind:
                  type: string
                  description: pass, fail, pending (published but not seen yet), or none (no DMARC record in DNS).
                detail: { type: string }
            spamassassin: {}
            report_url: { type: string }
    CapsuleTenant:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: WbLcFd }
        name: { type: string }
        slug: { type: string }
        suspended: { type: boolean }
    CapsuleInbox:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: PqRzMn }
        name: { type: string }
        address: { type: string }
        local_part: { type: string }
        host: { type: string }
        tenant_id: { type: string, example: WbLcFd }
        sending_domain_id: { type: [string, "null"] }
        webhook_url: { type: [string, "null"] }
        webhook_format: { type: string }
        webhook_secret: { type: string }
        forward_to: { type: [string, "null"] }
        mx_status: { type: string }
        mx_record: { type: [string, "null"] }
        mx_target: { type: [string, "null"] }
        inbound_emails_per_hour: { type: integer }
        retention_hours: { type: integer }
        stored_bytes:
          type: integer
          description: Bytes of received mail this inbox holds right now. Omitted from the list. Storage bills per GB-month.
    CapsuleInboundMessage:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: GxTyVu }
        inbox_id: { type: string, example: PqRzMn }
        to: { type: string }
        from: { type: [string, "null"] }
        subject: { type: [string, "null"] }
        text: { type: [string, "null"] }
        html: { type: [string, "null"] }
        thread_id: { type: [string, "null"] }
        in_reply_to: { type: [string, "null"] }
        headers: { type: object }
        envelope: { type: object }
        authentication:
          type: object
          additionalProperties: false
          properties:
            spf:
              type: object
              additionalProperties: false
              properties:
                result: { type: string }
                domain: { type: string }
            dkim:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  result: { type: string }
                  domain: { type: string }
                  selector: { type: string }
            dmarc:
              type: object
              additionalProperties: false
              properties:
                result: { type: string }
                policy: { type: string }
                aligned: { type: boolean }
            arc:
              type: object
              additionalProperties: false
              properties:
                result: { type: string }
        attachments:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              filename: { type: string }
              content_type: { type: string }
              size: { type: integer }
              content_base64: { type: [string, "null"], description: "Base64 of the decoded attachment. Present on show and JSON webhooks. Null after a webhook inbox delivers or gives up." }
        expires_at: { type: string }
        drain_status: { type: string }
        raw: { type: [string, "null"], description: "Raw MIME. Null after a webhook inbox delivers or gives up." }
    CapsuleOutboundMessage:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: OuTbMs }
        message_id: { type: string }
        from: { type: [string, "null"] }
        to: { type: array, items: { type: string } }
        cc: { type: array, items: { type: string } }
        bcc: { type: array, items: { type: string } }
        subject: { type: [string, "null"] }
        source: { type: string, enum: [api, account, template_test] }
        sandbox: { type: boolean }
        bytesize: { type: integer }
        retention_days: { type: integer }
        cluster_id: { type: [string, "null"], example: NmQpXr }
        tenant_id: { type: [string, "null"], example: WbLcFd }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        text: { type: [string, "null"], description: Show only. }
        html: { type: [string, "null"], description: Show only. }
        attachments:
          type: array
          description: Show only. Metadata; download the raw message for the bytes.
          items:
            type: object
            additionalProperties: false
            properties:
              filename: { type: [string, "null"] }
              content_type: { type: [string, "null"] }
              size: { type: integer }
    CapsuleOutboundRetention:
      type: object
      additionalProperties: false
      properties:
        retention_days: { type: integer, enum: [0, 7, 28, 45, 90, 180, 365] }
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              days: { type: integer }
              price_per_1000_cents: { type: number }
    CapsuleMessageEvent:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: JkLmNp }
        event_type: { type: string }
        recipient: { type: [string, "null"] }
        sender: { type: [string, "null"] }
        message_id: { type: [string, "null"] }
        mx_provider: { type: [string, "null"], description: MX provider reported for this delivery event. }
        sending_ip: { type: [string, "null"], description: Sending IP used for this delivery when known. }
        bounce_classification: { type: [string, "null"] }
        bounce_reason: { type: [string, "null"] }
        smtp_code: { type: [integer, "null"] }
        enhanced_code: { type: [string, "null"] }
        explanation: { type: [string, "null"] }
        occurred_at: { type: string, format: date-time }
        drain_status: { type: string }
        tenant_id: { type: [string, "null"], example: WbLcFd }
        sending_domain_id: { type: [string, "null"], example: HsVtYk }
        node_id: { type: [string, "null"], example: ZxHvTb }
        payload: { type: object, description: "Present for Full access. Omitted for a Support key." }
    CapsuleSmtpCredential:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: RvWsXq }
        username: { type: string }
        password: { type: string }
        tenant_id: { type: string, example: WbLcFd }
        tenant: { type: string }
        cluster_id: { type: string, example: NmQpXr }
    CapsuleWebhookEndpoint:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: CdFgHj }
        url: { type: string }
        enabled: { type: boolean }
        event_types: { type: array, items: { type: string } }
        last_success_at: { type: [string, "null"], format: date-time }
        last_failure_at: { type: [string, "null"], format: date-time }
        consecutive_failures: { type: integer }
        last_probed_at: { type: [string, "null"], format: date-time }
        last_probe_ok: { type: [boolean, "null"] }
