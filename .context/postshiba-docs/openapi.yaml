  /teams/{obfuscated_team_id}/shield_sites:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    get:
      operationId: listShieldSites
      summary: List ShieldShiba sites
      description: Omits secret_key.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Site list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapsuleShieldSite"
    post:
      operationId: createShieldSite
      summary: Create a ShieldShiba site
      description: Returns secret_key. allowed_hostnames also takes a comma or space separated string.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shield_site:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    allowed_hostnames:
                      oneOf:
                        - { type: string }
                        - { type: array, items: { type: string } }
                    block_hosting: { type: boolean }
                    block_free_email: { type: boolean }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "201":
          description: Created site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleShieldSite"
        "422":
          description: Invalid site
