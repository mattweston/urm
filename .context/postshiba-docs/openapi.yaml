                $ref: "#/components/schemas/CapsuleError"
  /clusters/{id}/reactivate:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: reactivateCluster
      summary: Reactivate an archived shared-IP cluster
      description: "Calls Cluster#reactivate!. A pending team can reactivate when it has no live cluster. Returns 403 {error: kyc_required} when a live cluster already exists and the team is not approved. Returns 403 {error: payment_required} when Stripe billing is on and the team has no card. Returns 403 {error: team_suspended} while the account is suspended. Returns 422 {error: dedicated} for a dedicated cluster and 422 {error: not_archived} if the cluster is still live."
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
