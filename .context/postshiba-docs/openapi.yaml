      - $ref: "#/components/parameters/id"
    patch:
      operationId: updateClusterAutoBoost
      summary: Turn auto-boost on or off
      description: With a sku set, a cluster that reaches its hourly or 24-hour limit boosts itself for 24 hours and the boost's one-time price is charged to the card on file. A blank sku turns it off. monthly_limit caps auto-boosts per calendar month (UTC).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sku:
                  type: [string, "null"]
                  description: A boost sku for the cluster's current plan, or blank to turn auto-boost off
                monthly_limit:
                  type: integer
                  minimum: 1
                  maximum: 10
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          description: "Cluster missing, or {error: feature_disabled}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "200":
          description: Cluster with the updated auto_boost setting
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleCluster"
        "403":
          description: payment_required or team_suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: "{error: archived} or {error: invalid}"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /teams/{obfuscated_team_id}/network:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    get:
      operationId: listNetwork
      summary: List available and owned sending IPs
      description: Optional classification or cluster_id filters to that class. Shared addresses mask the last octet until assigned to one of your clusters. Dedicated addresses are full when the team owns the row.
      parameters:
        - name: classification
          in: query
          required: false
          schema: { type: string, enum: [transactional, bulk] }
        - name: cluster_id
          in: query
          required: false
          schema: { type: string, example: NmQpXr }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Network IP list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapsuleNetworkIp"
    post:
      operationId: createNetworkIp
      summary: Buy or assign a chosen sending IP
      description: Shared IPs require cluster_id. A dedicated IP may stay unassigned. Paid adds return payment_required when Stripe billing is on and the team has no card.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ip_address_id: { type: string, example: IpQwEr }
                cluster_id: { type: string, example: NmQpXr }
                classification: { type: string, enum: [transactional, bulk] }
                split: { type: string, enum: [default, custom] }
                percents: { type: object, additionalProperties: { type: integer } }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "201":
          description: Purchased or assigned IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleNetworkIp"
        "403":
          description: payment_required or team_suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: empty_inventory, sku_unprovisioned, class_mismatch, cluster_required, already_claimed, or weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /teams/{obfuscated_team_id}/network/assign:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    post:
      operationId: assignNetworkIp
      summary: Assign an owned dedicated IP to a same-class cluster
      description: The IP can already sit on another of the team's same-class clusters. Returns dedicated_taken when that cluster already has a dedicated IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ip_address_id: { type: string, example: IpQwEr }
                cluster_id: { type: string, example: NmQpXr }
                split: { type: string, enum: [default, custom] }
                percents: { type: object, additionalProperties: { type: integer } }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Assigned IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleNetworkIp"
        "403":
          description: team_suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: class_mismatch, dedicated_taken, cluster_required, or weights
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /teams/{obfuscated_team_id}/network/unassign:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    post:
      operationId: unassignNetworkIp
      summary: Remove an IP from a cluster
      description: Returns last_ip when it is the cluster's only sending IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ip_address_id: { type: string, example: IpQwEr }
                cluster_id: { type: string, example: NmQpXr }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Unassigned IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleNetworkIp"
        "403":
          description: team_suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: last_ip or cluster_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /teams/{obfuscated_team_id}/network/switch:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    post:
      operationId: switchNetworkIp
      summary: Replace the included shared IP
      description: Free same-class shared switch of the included slot. No card required.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ip_address_id: { type: string, example: IpQwEr }
                cluster_id: { type: string, example: NmQpXr }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Switched IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleNetworkIp"
        "403":
          description: team_suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: last_ip, class_mismatch, or cluster_required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /teams/{obfuscated_team_id}/network/release:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    post:
      operationId: releaseNetworkIp
      summary: Return an owned dedicated IP to inventory
      description: Stops the dedicated IP bill. Returns last_ip when a cluster still has only that IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ip_address_id: { type: string, example: IpQwEr }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Released IP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleNetworkIp"
        "403":
          description: team_suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: last_ip or not_dedicated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /teams/{obfuscated_team_id}/clusters/{obfuscated_cluster_id}/smtp_credentials:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
      - $ref: "#/components/parameters/obfuscated_cluster_id"
    post:
      operationId: createSmtpCredential
      summary: Create SMTP credentials
      description: Password is returned once.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                smtp_credential:
                  type: object
                  additionalProperties: false
                  properties:
                    tenant_id: { type: string, example: WbLcFd }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "201":
          description: Credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSmtpCredential"
  /teams/{obfuscated_team_id}/clusters/{obfuscated_cluster_id}/smtp_credentials/{id}:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
      - $ref: "#/components/parameters/obfuscated_cluster_id"
      - $ref: "#/components/parameters/id"
    delete:
      operationId: disableSmtpCredential
      summary: Disable SMTP credentials
      description: Calls SmtpCredential#disable!. Password is omitted.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Disabled credential
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSmtpCredential"
  /teams/{obfuscated_team_id}/sending_domains:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    get:
      operationId: listSendingDomains
      summary: List sending domains
      description: Includes DKIM, SPF, and return-path records.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Domain list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapsuleSendingDomain"
    post:
      operationId: createSendingDomain
      summary: Create a sending domain
      description: Optional tenant_id. Queues a DNS check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sending_domain:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    dkim_selector: { type: string }
                    dkim_manual: { type: boolean }
                    dkim_private_key: { type: string, description: RSA private key PEM. Never returned. }
                    tenant_id: { type: string, example: WbLcFd }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "201":
          description: Created domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSendingDomain"
  /sending_domains/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      operationId: getSendingDomain
      summary: Get a sending domain
      description: DKIM CNAME or TXT, return-path CNAME, and optional DMARC TXT.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSendingDomain"
    delete:
      operationId: deleteSendingDomain
      summary: Delete a sending domain
      description: Calls SendingDomain#remove!. Live inboxes block. Disabled inboxes do not.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "204":
          description: Deleted
        "422":
          description: Cannot delete
    patch:
      operationId: updateSendingDomain
      summary: Update DKIM on a sending domain
      description: Change dkim_selector, dkim_manual, or import a PEM private key. Breaks authentication and sending until the new record verifies. Never returns dkim_private_key.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                sending_domain:
                  type: object
                  additionalProperties: false
                  properties:
                    dkim_selector: { type: string }
                    dkim_manual: { type: boolean }
                    dkim_private_key: { type: string, description: RSA private key PEM. Never returned. }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "403":
          description: team_suspended
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "422":
          description: Validation failed
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  errors:
                    type: array
                    items: { type: string }
        "200":
          description: Updated domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSendingDomain"
  /sending_domains/{id}/refresh:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: refreshSendingDomain
      summary: Issue new DKIM keys
      description: Breaks authentication and sending until you publish the new CNAME or TXT and verify.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "403":
          description: team_suspended
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "422":
          description: Operator DNS publish failed
        "200":
          description: Domain with new keys
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSendingDomain"
  /sending_domains/{id}/verify:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: verifySendingDomain
      summary: Verify a sending domain
      description: Runs a DNS check now and returns current statuses.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSendingDomain"
  /sending_domains/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: suspendSendingDomain
      summary: Suspend a sending domain
      description: Calls SendingDomain#suspend!.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Suspended domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSendingDomain"
  /sending_domains/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: resumeSendingDomain
      summary: Resume a sending domain
      description: "Calls SendingDomain#resume!. Returns 422 {error: operator_held} while PostShiba support has turned the domain off, 403 {error: dbl_listed} while the domain is on the Spamhaus DBL, and 503 {error: dbl_unavailable} when the listing cannot be re-checked."
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Resumed domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSendingDomain"
        "403":
          description: dbl_listed while the domain is on the Spamhaus DBL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "422":
          description: operator_held while PostShiba support has turned the domain off
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
        "503":
          description: dbl_unavailable when the listing cannot be re-checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /sending_domains/{id}/make_primary:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: makePrimarySendingDomain
      summary: Make a sending domain the account primary
      description: "Sets the account primary sending domain. The domain must be verified and not suspended."
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "422":
          description: Domain must be verified and not suspended
        "200":
          description: Primary domain
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleSendingDomain"
  /sending_domains/{id}/can_i_send_this:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: canISendThisSendingDomain
      summary: Test a sending domain with CanISendThis
      description: Mints a CanISendThis inbox and sends one message from hello@domain. Poll the same path with the returned token.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "403":
          description: Cluster not ready, domain unverified, or KYC blocked
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "502":
          description: CanISendThis or inject failed
        "200":
          description: Inbox minted and message queued
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [token, email, poll_after_seconds, poll_path, report_url]
                properties:
                  token: { type: string }
                  email: { type: string }
                  poll_after_seconds: { type: integer }
                  poll_path: { type: string }
                  report_url: { type: string }
    get:
      operationId: pollCanISendThisSendingDomain
      summary: Poll a CanISendThis report
      description: 202 waiting. 200 ready. 410 expired. 404 missing.
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "410":
          description: Inbox expired
        "202":
          description: Waiting for mail
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [waiting] }
        "200":
          description: Report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleCanISendThisReady"
  /teams/{obfuscated_team_id}/tenants:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    get:
      operationId: listTenants
      summary: List extra tenants
      description: Hides the default tenant.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Tenant list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapsuleTenant"
    post:
      operationId: createTenant
      summary: Create a tenant
      description: Slug is generated from name when omitted. Returns team_suspended while the account is suspended.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                tenant:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    slug: { type: string }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "201":
          description: Created tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleTenant"
        "403":
          description: team_suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleError"
  /tenants/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      operationId: getTenant
      summary: Get a tenant
      description: Includes the default tenant.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleTenant"
    delete:
      operationId: deleteTenant
      summary: Delete a tenant
      description: SMTP users are deleted. Domains and inboxes move to destination_tenant_id, or the default tenant when that is omitted. Rejected for the default tenant.
      parameters:
        - name: destination_tenant_id
          in: query
          required: false
          schema: {type: string}
          description: Tenant that receives domains and inboxes. Defaults to the team's default tenant.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "204":
          description: Deleted
        "422":
          description: Cannot delete
  /tenants/{id}/suspend:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: suspendTenant
      summary: Suspend a tenant
      description: Calls Tenant#suspend!.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Suspended tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleTenant"
  /tenants/{id}/resume:
    parameters:
      - $ref: "#/components/parameters/id"
    post:
      operationId: resumeTenant
      summary: Resume a tenant
      description: Calls Tenant#resume!.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Resumed tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleTenant"
  /teams/{obfuscated_team_id}/inboxes:
    parameters:
      - $ref: "#/components/parameters/obfuscated_team_id"
    get:
      operationId: listInboxes
      summary: List live inboxes
      description: Omits webhook_secret.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "200":
          description: Inbox list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CapsuleInbox"
    post:
      operationId: createInbox
      summary: Create an inbox
      description: Returns the webhook secret. Inbox create is open while KYC is pending. An active shared cluster is required for edge routing. Omit host and sending_domain_id for a hosted address. Set local_part and host for a domain-bound address; sending_domain_id is inferred from host when omitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                inbox:
                  type: object
                  additionalProperties: false
                  properties:
                    name: { type: string }
                    local_part: { type: string }
                    sending_domain_id: { type: string, example: HsVtYk }
                    tenant_id: { type: string, example: WbLcFd }
                    host: { type: string }
                    forward_to: { type: string }
                    webhook_url: { type: string }
                    webhook_format: { type: string }
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
          $ref: "#/components/responses/CapsuleNotFound"
        "201":
          description: Created inbox
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CapsuleInbox"
  /inboxes/{id}:
    parameters:
      - $ref: "#/components/parameters/id"
    get:
      operationId: getInbox
      summary: Get a live inbox
      description: Includes webhook_secret.
      responses:
        "401":
          $ref: "#/components/responses/CapsuleUnauthorized"
        "404":
