            additionalProperties: false
            properties:
              id: { type: string }
              name: { type: string }
              hourly_remaining: { type: integer }
              daily_remaining: { type: integer }
              queued: { type: integer }
        held_tenants:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string }
              slug: { type: string }
    CapsulePlannedSend:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: PlAnSd }
        name: { type: [string, "null"] }
        cluster_id: { type: string, example: NmQpXr }
        volume_per_hour: { type: integer }
        scheduled_for: { type: string, format: date-time }
        status: { type: string }
        assessment: { type: string, enum: [covered, boost_available, needs_operator] }
    CapsuleSuppression:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: YtReWq }
        email: { type: string }
        reason: { type: string }
        tenant_id: { type: string, example: WbLcFd }
        tenant: { type: string }
        created_at: { type: string, format: date-time }
    CapsuleSuppressionImport:
      type: object
      additionalProperties: false
      properties:
        imported: { type: integer }
        existing: { type: integer }
        invalid: { type: integer }
    CapsuleFirewallEntry:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: BnMkLo }
        list: { type: string }
        value: { type: string }
        created_at: { type: string, format: date-time }
    CapsuleFirewall:
      type: object
      additionalProperties: false
      properties:
        enabled_checks: { type: array, items: { type: string } }
        available_checks: { type: array, items: { type: string } }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/CapsuleFirewallEntry"
    CapsuleShieldSite:
      type: object
      additionalProperties: false
      properties:
        id: { type: string, example: ShLdSt }
        name: { type: string }
        public_key: { type: string }
        allowed_hostnames: { type: array, items: { type: string } }
        block_hosting: { type: boolean }
        block_free_email: { type: boolean }
        verifications_7d:
          type: object
          additionalProperties: false
          properties:
            passed: { type: integer }
            blocked: { type: integer }
        created_at: { type: string, format: date-time }
        secret_key: { type: string, description: "Present on create, show, and rotate_secret." }
    CapsuleSend:
      type: object
      additionalProperties: false
      properties:
        queued: { type: boolean }
        message_id: { type: string }
        from: { type: string }
        to: { type: array, items: { type: string } }
        subject: { type: string }
        unique_args: { type: object }
    CapsuleSendRequest:
      type: object
      properties:
        from: { type: string }
        to:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        cc:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        bcc:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        reply_to: { type: string }
        subject: { type: string }
        text: { type: string }
        html: { type: string }
        attachments:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              filename: { type: string }
              content_type: { type: string }
              content: { type: string }
        headers:
          type: object
          description: "Extra headers. Names must be RFC 5322 field names, or the request is 422 {error: invalid, field: headers}. Reserved names such as From, To, Subject, Date, Return-Path, DKIM-Signature, Content-*, Resent-*, and X-Capsule-* are ignored. X-Capsule-Ip is kept and sends the message from that sending IP on the cluster. _ counts as -."
        unique_args: { type: object }
        tenant: { type: string }
        template:
          type: object
          additionalProperties: false
          properties:
            id: { type: string, description: Template alias or public id }
            alias: { type: string }
            variables: { type: object }
        sandbox:
          description: true, "true", or 1 composes without inject. Success is 200 with queued false.
        send:
          description: Nested alias. Wins when present.
          type: object
    CapsuleError:
      type: object
      additionalProperties: false
      properties:
        error: { type: string }
        field: { type: string }
        message: { type: string }
        rule: { type: string, description: Firewall check that blocked the send. }
        retryable: { type: boolean, description: "On throttled and inject errors. true only when nothing was sent." }
  parameters:
    id:
      name: id
      in: path
      required: true
      schema:
        type: string
    obfuscated_team_id:
      name: obfuscated_team_id
      in: path
      required: true
      schema:
        type: string
        example: KjkAJW
    obfuscated_cluster_id:
      name: obfuscated_cluster_id
      in: path
      required: true
      schema:
        type: string
        example: NmQpXr
    after:
      name: after
      in: query
      required: false
      schema:
        type: integer
      description: "ID of item after which the collection should be returned"
  headers:
    PaginationNext:
      description: "ID of next item in collection if exists, to be used in `after` route param for cursor-style pagination"
      schema:
        type: integer
    Link:
      description: "Link to the next page"
      schema:
        type: string
  responses:
    CapsuleUnauthorized:
      description: Invalid token
    CapsuleNotFound:
      description: Not found
    CapsuleForbidden:
      description: Forbidden for this token
    CapsuleUnprocessable:
      description: Invalid import
