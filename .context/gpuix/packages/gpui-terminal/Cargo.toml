[package]
name = "gpui_terminal"
version = "0.1.0"
edition = "2024"
publish = false
license = "Apache-2.0"

[lints.rust]
unexpected_cfgs = { level = "allow" }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
type_complexity = "allow"

[lib]
path = "src/gpui_terminal.rs"

# GPUI comes from the fork checked out in the zed submodule, like packages/native.
[target.'cfg(any(target_os = "macos", target_os = "linux", target_os = "freebsd"))'.dependencies]
anyhow = "1.0.86"
base64 = "0.22"
flate2 = "1.1.8"
futures = "0.3.32"
gpui = { path = "../../zed/crates/gpui", default-features = false }
libc = "0.2"
log = "0.4.16"
parking_lot = "0.12.1"
raw-window-handle = "0.6"
smol = "2.0"
uuid = "1.1.2"

[target.'cfg(target_os = "macos")'.dependencies]
gpui_macos = { path = "../../zed/crates/gpui_macos", default-features = false, features = ["font-kit"] }
metal = "0.33"
objc = "0.2"

[target.'cfg(any(target_os = "linux", target_os = "freebsd"))'.dependencies]
gpui_wgpu = { path = "../../zed/crates/gpui_wgpu", features = ["font-kit"] }

[[example]]
name = "terminal_hello"
path = "examples/terminal_hello.rs"
