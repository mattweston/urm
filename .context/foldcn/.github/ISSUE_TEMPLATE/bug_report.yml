name: Bug report
description: Report a bug in a foldcn component or the registry
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! If you came from **Report issue** on the docs, the component and context below are prefilled in **Additional context** — just select the component in the dropdown and fill in the bug details.

  - type: dropdown
    id: component
    attributes:
      label: Affected component(s)
      description: Which component(s) does this bug affect? If you used Report issue on docs, please select the component shown in Additional context (GitHub can't auto-select dropdowns).
      multiple: true
      options:
        - accordion
        - alert
        - alert-dialog
        - animation
        - aspect-ratio
        - attachment
        - avatar
        - badge
        - breadcrumb
        - button
        - button-group
        - calendar
        - card
        - checkbox
        - collapsible
        - combobox
        - command
        - context-menu
        - date-picker
        - dialog
        - direction
        - drag-and-drop
        - drawer
        - empty
        - fieldset
        - file-drop
        - hover-card
        - input
        - input-group
        - input-otp
        - item
        - kbd
        - label
        - listbox
        - marker
        - menu
        - menubar
        - native-select
        - nav
        - navigation-menu
        - popover
        - progress
        - radio-group
        - resizable
        - select
        - separator
        - sheet
        - sidebar
        - skeleton
        - slider
        - spinner
        - switch
        - table
        - tabs
        - textarea
        - toast
        - toggle
        - toggle-group
        - tooltip
        - virtual-list
        - registry / CLI
        - docs / site
        - other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong
      placeholder: "The dialog doesn't close when pressing Escape…"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce, ideally with a minimal snippet or repo
      placeholder: |
        1. Install @foldcn/dialog…
        2. Render <Dialog> with…
        3. Press Escape / click overlay…
        4. See that…
      render: text
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
      placeholder: 'Dialog should close and restore focus to the trigger.'
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Include screenshots or recordings if helpful
      placeholder: 'Nothing happens. No error in console.'
    validations:
      required: false

  - type: dropdown
    id: style
    attributes:
      label: Style / theme
      description: Which base style are you using, if applicable?
      multiple: false
      options:
        - default
        - not sure
        - not applicable
      default: 0
    validations:
      required: false

  - type: input
    id: versions
    attributes:
      label: Versions
      description: Relevant versions (foldcn, @foldkit/ui, framework, package manager)
      placeholder: 'foldcn 0.1.0, @foldkit/ui 0.x, Next.js 15, pnpm 11'
    validations:
      required: false

  - type: input
    id: browser
    attributes:
      label: Browser / environment
      description: Browser, OS, or runtime where the bug occurs
      placeholder: 'Chrome 126 on macOS 15, Node 22'
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help (logs, links, workarounds)
      render: text
    validations:
      required: false
