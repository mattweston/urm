# Rebuilt for the single-project repo. Every catalog entry below is referenced by
# a manifest that exists today; the old file's unreferenced groups were dropped
# rather than carried over. See pnpm-workspace-old.yaml.md for what was there.
packages:
  - "apps/*"
  - "packages/*"
  - "packages/tools/*"
  # The non-SaaS, project-based target. Empty for now; harmless until it is not.
  - "projects/*"

# `.sort` and `.context` are staging areas, not workspace members, so no glob
# reaches them. `packages/.sort/ssg` (@urm/ssg) therefore does not resolve; if it
# goes live it moves into packages/ rather than gaining a glob of its own.

catalog:
  effect: 4.0.5
  foldkit: 0.168.0
  foldkit-remote: 0.18.0
  foldkit-remote-server: 0.15.0
  foldkit-surface: 0.10.0
  typescript: 7.0.2

catalogs:
  auth:
    # On the way out. Last real release 2025-05-21, and the only importers
    # are packages/auth/src/oauth/oauth-google.ts and google-handlers.ts,
    # both of which @yielded/auth/Google replaces. Kept only so
    # packages/auth still resolves; delete it with those two files.
    arctic: 3.7.0
    # Dropped with no replacement needed: @oslojs/crypto and
    # @oslojs/encoding were catalogued but imported nowhere.
    #
    # Pinned exact, not ranged: beta.40 through beta.43 landed inside four
    # days, and the jose/oauth/crypto support packages are being ported
    # into Effect-TS/auth, so these names are not final.
    "@yielded/auth": 0.1.0-beta.43
    "@yielded/auth-persistence": 0.1.0-beta.43
    "@yielded/auth-persistence-drizzle": 0.1.0-beta.43
    "@yielded/auth-simplewebauthn": 0.1.0-beta.43
  browser:
    "@effect/platform-browser": 4.0.5
  build:
    turbo: 2.9.14
    vite: 7.3.6
  database:
    "@effect/sql-pg": 4.0.5
    # The SQLite half of the postgres/sqlite option. Add -bun, -libsql, -d1
    # or -pglite only when something imports them.
    "@effect/sql-sqlite-node": 4.0.5
    "@types/pg": 8.18.0
    # rc.4 is the floor for @yielded/auth-persistence-drizzle.
    drizzle-kit: 1.0.0-rc.5
    drizzle-orm: 1.0.0-rc.5
    pg: 8.20.0
  dev:
    concurrently: 9.2.4
    dotenv: 16.4.5
  env:
    dotenv: 17.2.3
  frontend:
    "@types/node": 22.20.5
  layout:
    "@tailwindcss/vite": 4.1.14
    class-variance-authority: 0.7.1
    clsx: 2.1.1
    tailwind-merge: 3.3.1
    tailwindcss: 4.1.11
    tw-animate-css: 1.4.0
  lint:
    "@foldkit/oxlint-plugin": 0.15.3
    eslint-plugin-better-tailwindcss: 3.8.0
    oxfmt: 0.18.0
    oxlint: 1.58.0
    prettier: 3.6.2
  llms:
    "@effect/ai": 0.35.0
    agent-tail: 0.3.5
    opencode-ai: 1.2.5
  media:
    "@aws-sdk/client-s3": 3.840.0
    "@aws-sdk/s3-request-presigner": 3.840.0
  observability:
    "@sentry/browser": 10.65.0
  server:
    "@effect/platform-node": 4.0.5
    "@effect/tsgo": 0.56.0
    "@types/node": 22.20.5
  testing:
    "@effect/vitest": 4.0.5
    "@faker-js/faker": "^10.0.0"
    vitest: 4.1.10
  types:
    "@types/three": 0.185.0
  ui:
    "@foldkit/ui": 0.168.0
    "@tiptap/core": 3.6.6
    "@tiptap/extension-link": 3.6.6
    "@tiptap/starter-kit": 3.6.6
    abcjs: 6.6.3
    animejs: 4.5.0
    chart.js: 4.5.0
    mapbox-gl: 3.15.0
    maplibre-gl: 5.24.0
    photoswipe: 5.4.4
    prosekit: 0.15.8
    three: 0.185.0
    tone: 15.1.22
  utils:
    date-fns: 4.1.0

overrides:
  "@effect/platform-browser": 4.0.5
  # Keep drizzle-orm on one instance. Both are optional drizzle peers, and a
  # consumer that leaves them floating gets its own copy of drizzle whose table
  # types will not unify with the schema in packages/database.
  pg: 8.20.0
  # 22.20.5 rather than the catalog's old 22.10.2: vite@8 peers
  # ">=22.12.0", which 22.10.2 did not satisfy. Same major, so no lib churn.
  "@types/node": 22.20.5

allowBuilds:
  "@parcel/watcher": false
  "@sentry/cli": true
  "@tailwindcss/oxide": true
  esbuild: false
  msgpackr-extract: true
  opencode-ai: true
  sharp: true
  # Pulled in by wrangler. Its postinstall downloads a platform binary the repo
  # never runs, and pnpm aborts the install until the decision is recorded.
  workerd: false

peerDependencyRules:
  allowedVersions:
    # Every @foldkit/* package peers effect at one exact version — 0.168.0 wants
    # the string "4.0.0", the older ones want "4.0.0-rc.112" — so each needs an
    # override against effect 4.0.5. Bumping foldkit does not remove these.
    # @foldkit/oxlint-plugin declares no peers, so it needs no entry.
    "@foldkit/devtools>@effect/platform-browser": 4.0.5
    "@foldkit/markdown>effect": 4.0.5
    "@foldkit/ui>effect": 4.0.5
    "@foldkit/vite-plugin>effect": 4.0.5
    "foldkit>@effect/platform-browser": 4.0.5
    "foldkit>effect": 4.0.5

# 7 days × 24 hours × 60 minutes = 10,080 minutes
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
    # Name patterns, not pinned versions. pnpm globs these, so they survive a
    # version bump and they cover transitive and platform-binary siblings --
    # @effect/platform-node-shared and the seven @effect/tsgo-<platform>
    # packages each had to be named by hand under the old exact-version list,
    # and each one aborted an install until it was.
    #
    # Only families tracked deliberately close to their releases belong here.
    # Everything else waits out the week.
    - effect
    - "@effect/*"
    - "@yielded/*"
    - "drizzle-orm"
    - "drizzle-kit"
    - foldkit
    - "foldkit-*"
    - "@foldkit/*"
